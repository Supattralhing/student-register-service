services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: student_register
      POSTGRES_USER: student_user
      POSTGRES_PASSWORD: student_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - student_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U student_user -d student_register"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  student_data:
